<title>Picross: Cryptozoology</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;

    --link: #0b57d0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --fg: #eaeaea;
      --muted: #b3b3b3;
      --link: #8ab4f8;
    }

  html, body {
    background: var(--bg);
    color: var(--fg);
  }
  body {
    max-width: 40rem;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    font-size: 1.05rem;
  }
  h1 {
    font-size: 1.6rem;
    line-height: 1.3;
    margin-bottom: 0.25rem;
  }
  p.tagline {
    color: var(--muted);
    margin-top: 0;
  }
  a {
    color: var(--link);
  }
  ul {
    padding-left: 1.4rem;
  }
  li {
    margin: 0.35rem 0;
  }
</style>
</head>
